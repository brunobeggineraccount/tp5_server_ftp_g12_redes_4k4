version: '3.8'

services:
  ftpserver:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ftpserver
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - ./ftp_data:/home/ftpuser/ftp_files
    restart: unless-stopped

  ftpclient:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: ftpclient
    depends_on:
      - ftpserver
    stdin_open: true
    tty: true
